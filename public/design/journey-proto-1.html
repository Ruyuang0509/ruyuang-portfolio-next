<!-- K-35 轉址存根。原型曾部署在這個網址(手機測試單與筆記都指向它),遷移後旅程就是首頁,
     舊網址不斷線。刻意手寫為 public/ 靜態檔而非 Astro redirects 設定:後者產生的是同名「目錄」
     而非原檔名,且目的地不套 base(實測指到網域根=別的站)。此處路徑必須含 base,靜態檔讀不到
     import.meta.env;base 若變更,本檔與 astro.config.mjs 要一起改。 -->
