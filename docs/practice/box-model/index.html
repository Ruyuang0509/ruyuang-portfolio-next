<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>盒模型 ＋ 文繞圖練習：圖片置左、文字在右</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page__head">
        <h1 class="page__title">盒模型 ＋ 文繞圖練習</h1>
        <label class="toggle">
          <input id="annotate" type="checkbox" checked />
          顯示間距標註（對應白板上的紅色箭頭）
        </label>
      </header>

      <!-- 白板藍框＝最外層 <div>。圖片放在最前面，float 才有東西可以繞。 -->
      <div class="card">
        <!-- 白板綠框＝浮到左上角的圖片區塊 -->
        <figure class="card__figure">
          <img
            class="card__image"
            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 200'><rect width='320' height='200' fill='%23dbeafe'/><circle cx='108' cy='72' r='30' fill='%2360a5fa'/><path d='M28 176 L124 88 L184 140 L238 104 L300 176 Z' fill='%233b82f6'/></svg>"
            alt="示意圖片：藍色調的山景插圖"
          />
          <figcaption class="card__caption">圖片區塊（float: left）</figcaption>
        </figure>

        <!-- 標題和段落沒有做任何「靠右」設定，是圖片浮開之後空出來的位置 -->
        <h2 class="card__title">標題文字（h2）</h2>

        <p class="card__text">
          第一段文字。圖片用 <code>float: left</code> 浮到左上角之後，
          這些文字會自動排到它的右邊，不需要對文字做任何設定。
        </p>
        <p class="card__text">
          第二段文字。圖片和文字之間的空隙，是圖片自己的
          <code>margin-right</code> 撐出來的。沒有給的話文字會直接貼上去。
        </p>
        <p class="card__text">
          第三段文字，故意寫長一點。文字的量超過圖片高度之後，多出來的部分
          會自動繞到圖片下方接續排列——這就是「文繞圖」，也是 float 和
          <code>flex</code> 最關鍵的差別。
        </p>
      </div>

      <ul class="legend">
        <li><span class="legend__swatch legend__swatch--blue"></span>藍框＝外層 <code>div</code>（.card）</li>
        <li><span class="legend__swatch legend__swatch--green"></span>綠框＝圖片區塊（.card__figure）</li>
        <li><span class="legend__swatch legend__swatch--red"></span>紅色網底＝該元素的 <code>padding</code> 佔掉的空間</li>
      </ul>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
